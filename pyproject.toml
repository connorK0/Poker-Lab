[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-lab"
version = "0.1.0"
description = "Offline research framework for poker opponent modeling and exploitation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pokerkit>=0.7.7,<0.8",
    "phevaluator>=0.6,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
nn = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["poker_lab*"]

[tool.setuptools.package-data]
poker_lab = ["bots/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running statistical or end-to-end tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "error::UserWarning:pokerkit.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["experiments/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "NPY", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings (we use plain ASCII but allow math symbols in docs)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["poker_lab", "experiments"]
