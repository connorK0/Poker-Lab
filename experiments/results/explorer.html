<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Results Explorer</title>
<style>/* Results explorer. Colors are the validated reference palette used by every PNG figure in
   this repo (experiments/plotting.py): categorical slots c1-c8 in fixed order, a one-hue
   sequential ramp for heatmaps, and chart chrome tokens. Dark values are their own steps,
   not an automatic flip. */

:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #ffffff;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.05);
  --wash: #cde2fb;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --seq0: #f0efec; --seq1: #cde2fb; --seq2: #b7d3f6; --seq3: #9ec5f4; --seq4: #86b6ef;
  --seq5: #5598e7; --seq6: #2a78d6; --seq7: #1c5cab; --seq8: #104281;
  --seq-ink-lo: #0b0b0b; --seq-ink-hi: #ffffff;
  --good: #006300;
  --shadow: 0 4px 16px rgba(11, 11, 11, 0.12);
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --raised: #222220;
    --ink: #f0efec;
    --ink2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --wash: #253445;
    --accent: #3987e5;
    --accent-ink: #0b0b0b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --seq0: #262624; --seq1: #0d366b; --seq2: #104281; --seq3: #184f95; --seq4: #1c5cab;
    --seq5: #256abf; --seq6: #2a78d6; --seq7: #5598e7; --seq8: #86b6ef;
    --seq-ink-lo: #f0efec; --seq-ink-hi: #0b0b0b;
    --good: #0ca30c;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --raised: #222220;
  --ink: #f0efec;
  --ink2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --hover: rgba(255, 255, 255, 0.06);
  --wash: #253445;
  --accent: #3987e5;
  --accent-ink: #0b0b0b;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --seq0: #262624; --seq1: #0d366b; --seq2: #104281; --seq3: #184f95; --seq4: #1c5cab;
  --seq5: #256abf; --seq6: #2a78d6; --seq7: #5598e7; --seq8: #86b6ef;
  --seq-ink-lo: #f0efec; --seq-ink-hi: #0b0b0b;
  --good: #0ca30c;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--font);
}

button, select { font: inherit; color: inherit; }

a { color: var(--accent); }

.app {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 100vh;
}

/* ------------------------------------------------------------------ navigation */

.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: 100vh;
  overflow-y: auto;
  padding: 20px 14px 32px;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.nav-title {
  display: block;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
  font: inherit;
  margin: 0 6px 4px;
  font-weight: 650;
  font-size: 15px;
  color: var(--ink);
  text-decoration: none;
}

.nav-sub { margin: 0 6px 16px; color: var(--muted); font-size: 12.5px; }

.nav-phase { margin-top: 14px; }

.nav-link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink2);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.nav-link:hover { background: var(--hover); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.nav-link.phase { color: var(--ink); font-weight: 600; }
.nav-link.section { padding-left: 20px; font-size: 13.5px; }
.nav-link.planned { color: var(--muted); }
.nav-badge {
  margin-left: auto;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}

.nav-footer { margin: 20px 6px 0; display: flex; gap: 8px; align-items: center; }

.theme-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--raised);
  cursor: pointer;
  font-size: 12.5px;
}

.nav-select { display: none; }

/* ------------------------------------------------------------------ main column */

.main { padding: 28px 32px 64px; max-width: 1240px; outline: none; }

.crumb { color: var(--muted); font-size: 12.5px; margin: 0 0 4px; }
.crumb button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }

h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; font-weight: 650; }
h2 { font-size: 17px; margin: 28px 0 10px; font-weight: 600; }

.lead { color: var(--ink2); max-width: 820px; margin: 0 0 18px; }

.badge {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border-radius: 99px;
  border: 1px solid var(--border);
  color: var(--ink2);
  font-size: 12px;
  font-weight: 500;
  vertical-align: middle;
}

/* stat tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin: 8px 0 20px;
}

.tile {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}

.tile-label { color: var(--ink2); font-size: 12.5px; }
.tile-value { font-size: 26px; font-weight: 600; margin: 2px 0; }
.tile-note { color: var(--muted); font-size: 12px; }

/* cards linking to phases and sections */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.card {
  display: block;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.card:hover { background: var(--raised); box-shadow: var(--shadow); }
.card:focus-visible, .nav-link:focus-visible, .seg button:focus-visible,
.legend button:focus-visible, .chart-svg:focus-visible, .tbl-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card[disabled] { cursor: default; opacity: 0.7; box-shadow: none; }
.card-title { font-weight: 600; margin-bottom: 4px; }
.card-text { color: var(--ink2); font-size: 13px; }
.card-meta { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* controls: one row above the charts they scope */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  align-items: flex-end;
  padding: 12px 0 14px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--page);
}

.controls > div { min-width: 0; max-width: 100%; }
.control-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
}

.seg button {
  padding: 5px 11px;
  border: 0;
  border-right: 1px solid var(--border);
  background: none;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink2);
}

.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 13px;
}

/* charts */
.charts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr));
  gap: 16px;
  transition: opacity 120ms;
}

.figure {
  margin: 0;
  padding: 14px 16px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  min-width: 0;
}

.figure.wide { grid-column: 1 / -1; }

.fig-head { display: flex; gap: 12px; align-items: flex-start; }
.fig-title { font-weight: 600; font-size: 14px; }
.fig-sub { color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.fig-tools { margin-left: auto; display: flex; gap: 6px; }

.tbl-btn {
  padding: 2px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: none;
  cursor: pointer;
  font-size: 12px;
  color: var(--ink2);
  white-space: nowrap;
}

.tbl-btn[aria-pressed="true"] { background: var(--hover); color: var(--ink); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 4px;
  margin: 8px 0 2px;
}

.legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px;
  border: 0;
  border-radius: 5px;
  background: none;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink2);
}

.legend button:hover { background: var(--hover); }
.legend button[aria-pressed="false"] { opacity: 0.45; }
.legend button[aria-pressed="false"] .key { filter: grayscale(1); }
.legend-hint { color: var(--muted); font-size: 11.5px; align-self: center; margin-left: 4px; }

.chart-box { position: relative; width: 100%; }
.hover-target { outline: none; }
.hover-target:focus-visible { stroke: var(--accent); stroke-width: 2; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-svg text { font-family: var(--font); }
.tick { fill: var(--ink2); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-title { fill: var(--ink2); font-size: 12px; }
.ref-label {
  fill: var(--ink2);
  font-size: 11px;
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.row-label { fill: var(--ink2); font-size: 12px; }
.cell-label { font-size: 11.5px; font-variant-numeric: tabular-nums; pointer-events: none; }

.notes { color: var(--ink2); font-size: 12.5px; margin: 10px 0 0; }

.takeaways { margin: 0; padding-left: 20px; max-width: 860px; }
.takeaways li { margin: 4px 0; }

details.method { margin-top: 14px; max-width: 860px; color: var(--ink2); }
details.method summary { cursor: pointer; color: var(--ink); }

.sources { margin-top: 24px; color: var(--muted); font-size: 12px; }
.sources code { font-size: 11.5px; }

/* data tables (the accessible twin of every chart) */
.table-wrap { max-height: 420px; overflow: auto; margin-top: 8px; }
table.data { border-collapse: collapse; font-size: 12.5px; width: 100%; }
table.data th, table.data td {
  padding: 4px 10px 4px 0;
  border-bottom: 1px solid var(--grid);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--ink2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
.ci { color: var(--muted); }

/* tooltip */
.tooltip {
  position: fixed;
  z-index: 50;
  max-width: 340px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  pointer-events: none;
}

.tt-head { color: var(--ink2); margin-bottom: 4px; }
.tt-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tt-key { width: 14px; height: 0; border-top: 2.5px solid; flex: none; }
.tt-key.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; }
.tt-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.tt-name { color: var(--ink2); }
.tt-ci { color: var(--muted); font-variant-numeric: tabular-nums; }

.empty {
  padding: 28px;
  border: 1px dashed var(--axis);
  border-radius: 10px;
  color: var(--ink2);
  max-width: 760px;
}

/* ------------------------------------------------------------------ narrow screens */

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .nav {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .nav-tree { display: none; }
  .nav-select { display: block; width: 100%; margin-top: 8px; }
  .nav-sub { display: none; }
  .nav-footer { margin: 10px 0 0; }
  .main { padding: 18px 16px 48px; }
  .controls { position: static; }
}
</style>
</head>

  // ---------------------------------------------------------------- routing

  /* Two link forms: a plain token, #phase2 or #phase2.exploit (the only form a host page

  function parseHash() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.charAt(0) !== "/") {

      return { phase: tok[0] || null, section: tok[1] || null, params: {} };
    }
    raw = raw.slice(1);
    var q = raw.split("?");

    var params = {};

  }

    if (section) {

        current.figures.push(fig);
      });
      current.figures.forEach(function (f) { f._draw(); });
      (v.notes || []).forEach(function (n) { notes.appendChild(h("p", { className: "notes", text: n })); });
    }

    if (sec.controls.length) {
      var bar = h("div", { className: "controls", role: "group", "aria-label": "View options" });
      sec.controls.forEach(function (c) {
        var label = h("span", { className: "control-label", text: c.label });
        var widget;
        if (c.options.length > 7) {
          widget = h("select", { className: "select", "aria-label": c.label, onchange: function (e) { set(c.id, e.target.value); } });
          c.options.forEach(function (o) { widget.appendChild(h("option", { value: o.value, text: o.label })); });
          widget.value = vals[c.id];
        } else {
          widget = h("div", { className: "seg", role: "group", "aria-label": c.label });
          c.options.forEach(function (o) {
            widget.appendChild(h("button", { type: "button", "aria-pressed": String(vals[c.id] === o.value), "data-value": o.value, onclick: function () { set(c.id, o.value); } }, o.label));
          });
        }
        bar.appendChild(h("div", {}, label, widget));
      });
      MAIN.appendChild(bar);
    }

    function set(id, value) {
      vals[id] = value;
      MAIN.querySelectorAll(".controls .seg").forEach(function (seg, i) {
        var c = sec.controls.filter(function (cc) { return cc.options.length <= 7; })[i];
        if (!c) return;
        seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(vals[c.id] === b.getAttribute("data-value"))); });
      });
      drawView();
    }

    MAIN.appendChild(chartsWrap);
    MAIN.appendChild(notes);
    drawView();
    if (sec.takeaways.length) {
      MAIN.appendChild(h("h2", { text: "What it shows" }));
      MAIN.appendChild(h("ul", { className: "takeaways" }, sec.takeaways.map(function (t) { return h("li", { text: t }); })));
    }
    if (sec.method) MAIN.appendChild(h("details", { className: "method" }, h("summary", { text: "How it was computed" }), h("p", { text: sec.method })));
    var prov = p.provenance.filter(function (pv) { return sec.sources.indexOf(pv.file) >= 0; });
    append(MAIN, provenanceBlock(prov.length ? prov : sec.sources.map(function (f) { return { file: f, seed: "", commit: "" }; })));
  }

  // ---------------------------------------------------------------- start

  window.addEventListener("error", function (e) {
    var msg = h("div", { className: "empty", role: "alert", "data-error": "1", text: "Something went wrong drawing this page: " + (e.message || e) });
    MAIN.insertBefore(msg, MAIN.firstChild);
  });

  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  window.addEventListener("scroll", hideTip, { passive: true });
  if (!EMBEDDED && getTheme() !== "auto") applyTheme(getTheme());  // never clear a host's choice
  route();
})();
</script>
</body>
</html>
