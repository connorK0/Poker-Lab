# Smoke test of every Phase 3 step (not for reporting): python -m experiments.run_phase3 --quick
name: phase3_quick

pushfold:
  stack_min: 1.0
  stack_max: 6.0
  stack_step: 0.5
  display_stacks: [2, 5]
  cfr_stacks: [5]
  cfr_iterations: 100
  cfr_per_decade: 4
  heuristics:
    tight: {push: 0.20, call: 0.10}
  heuristic_stacks: [2, 5]
  workers: 4

exploit:
  stack: 10
  seeds: 2
  train_per_archetype: 5
  test_per_archetype: 1
  sizes: [10, 100]
  ps: [0.5]
  dbr_pseudocount: 10
  freq_pseudocount: 10
  workers: 4

bridge:
  stacks: [10, 20]  # 20 bb: pure equilibrium, so Nash vs Nash duplicate has zero variance
  heroes: [nash, best_response]
  opponents: [maniac, nash]
  n_deals: 2000
  chunk_deals: 1000
  half_width: 0.05
  workers: 4

recommend:
  stack: 10
  seeds: 2
  train_per_archetype: 5
  test_per_archetype: 1
  sizes: [0, 10, 100]
  ps: [0.25, 0.5]
  level: 0.9
  draws: 500
  workers: 4

fitcheck:
  stack: 10
  seeds: 2
  train_per_archetype: 5
  test_per_archetype: 1
  sizes: [10, 100]
  calibration_bots: 20
  fit_level: 0.05
  check_draws: 100
  ps: [0.25, 0.5]
  level: 0.9
  draws: 500
  workers: 4

confirm:
  stack: 10
  seeds: 2
  train_per_archetype: 5
  test_per_archetype: 1
  sizes: [10, 100]
  calibration_bots: 20
  fit_level: 0.05
  check_draws: 100
  ps: [0.25, 0.5]
  level: 0.9
  draws: 500
  workers: 4

import:
  round_trip_tables: 12
  round_trip_hands: 5
  mutation_hands: 30
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  dataset_paths: [pluribus/100, wsop, dwan-ivey-2009.phh]
  workers: 4

priors:
  real_source: standin
  standin: {players: 13, sessions: 36, session_hands: 60}
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  dataset_path: pluribus
  bot_player: Pluribus
  phase1_config: experiments/configs/phase1_quick.yaml
  phase1_master_seed: 2026
  estimate_sizes: [25, 50, 100, 200]
  windows_max: 6
  prior_bootstrap: 50
  bootstrap: 200
  min_players_grid: [2, 5, 12, 30, 60]
  subset_draws: 4
  support_alpha: 0.05
  consistency_reference: 200
  action_checkpoints: [0, 25, 100, 250]   # phase1_quick's
  action_window: 50
  action_train_rows: 20000
  workers: 4

sequence:
  phase1_config: experiments/configs/phase1_quick.yaml
  phase1_master_seed: 2026
  variants: [seq, bag, counters]
  model: {pool: rates, n_rates: 16, hidden: 32, epochs: 8, patience: 8, lr: 0.002,
          weight_decay: 0.0001, dropout: 0.1, players_per_batch: 4}
  torch_threads: 4
  real_source: standin
  standin: {players: 13, sessions: 36, session_hands: 60}
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  dataset_path: pluribus
  bot_player: Pluribus
  transfer_models: [lr, seq]
  extra_per_archetype: 12
  scale_variants: [bag, counters]
  windows_max: 6
  consistency_reference: 200
  bootstrap: 200
  workers: 4

schema:
  tables: 16
  hands: 4
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  v1_commit: 0cf0c4f1db21cb7e134da52a38f5473a53be0ca0
  v1_tables: 4
  v1_hands: 3
  v1_pluribus_paths: [pluribus/100]
  v1_chunks: 2
  public_paths: [dwan-ivey-2009.phh]
  workers: 4
