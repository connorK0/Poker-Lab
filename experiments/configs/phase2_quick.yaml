# Small, fast version of phase2.yaml for smoke tests. Not for reporting.
name: phase2_quick
cfr:
  variants: [cfr, cfr+, lcfr, dcfr]
  iterations: {kuhn: 300, leduc: 100}
  per_decade: 4
  mccfr_seeds: 2
  mccfr_iterations: {kuhn: 2000, leduc: 1000}
  mccfr_per_decade: 2
  ablation_iterations: 100  # post hoc: discounted-CFR exponent grid on Leduc
deep_cfr:
  seeds: 2
  traversals: 100
  checkpoints: [1, 2, 4]
  policy_checkpoints: [4]
  hidden: [16, 16]
  advantage_steps: 30
  policy_steps: 100
  workers: 6
exploit:
  seeds: 2
  train_per_archetype: 4
  test_per_archetype: 1
  sizes: [10, 100]
  ps: [0.5, 0.9]
  dbr_pseudocount: 10
  workers: 4
aivat:
  bots_per_archetype: 1
  rnr_p: 0.9
  cfr_checkpoints: [1, 10]
  half_width: 0.1
  sampled_bots: 1
  sampled_pairs: 300
  pushfold:
    stacks: [3]             # not a stack of the full run
    half_width: 0.05
  workers: 4
duplicate:
  replicates: 1
  population_per_archetype: 6
  lineups: {clones_6: 5, mirror_6: 5, mixed_6: 3, mixed_3: 3, mixed_2: 3}
  deals: 100
  chunk_deals: 50
  calling_deals: 20
  equity_samples: 150
  half_width: 5
  bootstrap: 200
  workers: 4

randomness:
  replicates: 1
  population_per_archetype: 6
  lineups_per_replicate: 5
  deals: 100
  chunk_deals: 50
  equity_samples: 150
  half_width: 5
  bootstrap: 200
  workers: 4
misspec:
  seeds: 2
  train_per_archetype: 4
  test_per_archetype: 1
  sizes: [10, 100]
  ps: [0.5, 0.9]
  dbr_pseudocount: 10
  session:
    hands: 200
    period: 50
    pseudo: 10
    refit_every: 100
    fit_once_at: 100
    recent_window: 100
    rnr_p: 0.9
    rnr_p_low: 0.5
  adaptive:
    family_fast: {speed: 0.5, window: 100, mode: family}
    tabular_fast: {speed: 0.5, window: 100, mode: tabular}
  workers: 4
lbr:
  deep_stack: 100
  shallow_stack: 10
  deep_deals: 20
  shallow_deals: 40
  chunk_deals: 10
  flop_sample: 60
  ablation_opponents: [pot_odds]
  ablation_deals: 10
  workers: 4
