# Phase 3 experiments. Run everything with: python -m experiments.run_phase3 --seed 2026
name: phase3

pushfold:
  # Exact Nash (sequence-form LP) on a grid of effective stacks, in big blinds.
  stack_min: 1.0
  stack_max: 20.0
  stack_step: 0.05
  # Stacks whose full per-hand strategies are stored (explorer heatmaps, figures).
  display_stacks: [1.5, 2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 16, 18, 20]
  # CFR+ vs LP.
  cfr_stacks: [5, 10, 20]
  cfr_iterations: 3000
  cfr_per_decade: 8
  # Heuristic range rules scored by exploitability (fixed before the first run).
  heuristics:
    tight: {push: 0.20, call: 0.10}
    medium: {push: 0.45, call: 0.25}
    loose: {push: 0.75, call: 0.45}
  heuristic_stacks: [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
  workers: 12

exploit:
  # P3.2: modeling and exploiting push/fold bots (pre-registered; see phase3_exploit.py).
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [10, 30, 100, 300, 1000, 3000]
  ps: [0.5, 0.9]
  dbr_pseudocount: 10
  freq_pseudocount: 10
  workers: 12

bridge:
  # P3.3: the push/fold provider in real hands (PokerKit) vs the exact abstract game
  # (pre-registered; see phase3_bridge.py).
  stacks: [5, 10, 20]
  heroes: [nash, best_response]
  opponents: [nit, tag, lag, calling_station, maniac, nash]
  n_deals: 100000  # per matchup; each deal is played twice (duplicate)
  chunk_deals: 5000
  half_width: 0.05  # bb/hand, for the hands-needed comparison
  workers: 12

recommend:
  # P3.4: ranked exploit recommendations with confidence (pre-registered; see
  # phase3_recommend.py). Same game, seeds and held-out bots as `exploit` (P3.2).
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [0, 10, 30, 100, 300, 1000, 3000]
  ps: [0.1, 0.25, 0.5, 0.75, 0.9]
  level: 0.9  # central credible interval; candidates are ranked by its lower end
  draws: 2000  # importance-sampling draws per posterior
  workers: 12
