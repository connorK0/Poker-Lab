# Phase 3 experiments. Run everything with: python -m experiments.run_phase3 --seed 2026
name: phase3

pushfold:
  # Exact Nash (sequence-form LP) on a grid of effective stacks, in big blinds.
  stack_min: 1.0
  stack_max: 20.0
  stack_step: 0.05
  # Stacks whose full per-hand strategies are stored (explorer heatmaps, figures).
  display_stacks: [1.5, 2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 16, 18, 20]
  # CFR+ vs LP.
  cfr_stacks: [5, 10, 20]
  cfr_iterations: 3000
  cfr_per_decade: 8
  # Heuristic range rules scored by exploitability (fixed before the first run).
  heuristics:
    tight: {push: 0.20, call: 0.10}
    medium: {push: 0.45, call: 0.25}
    loose: {push: 0.75, call: 0.45}
  heuristic_stacks: [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
  workers: 12

exploit:
  # P3.2: modeling and exploiting push/fold bots (pre-registered; see phase3_exploit.py).
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [10, 30, 100, 300, 1000, 3000]
  ps: [0.5, 0.9]
  dbr_pseudocount: 10
  freq_pseudocount: 10
  workers: 12

bridge:
  # P3.3: the push/fold provider in real hands (PokerKit) vs the exact abstract game
  # (pre-registered; see phase3_bridge.py).
  stacks: [5, 10, 20]
  heroes: [nash, best_response]
  opponents: [nit, tag, lag, calling_station, maniac, nash]
  n_deals: 100000  # per matchup; each deal is played twice (duplicate)
  chunk_deals: 5000
  half_width: 0.05  # bb/hand, for the hands-needed comparison
  workers: 12

recommend:
  # P3.4: ranked exploit recommendations with confidence (pre-registered; see
  # phase3_recommend.py). Same game, seeds and held-out bots as `exploit` (P3.2).
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [0, 10, 30, 100, 300, 1000, 3000]
  ps: [0.1, 0.25, 0.5, 0.75, 0.9]
  level: 0.9  # central credible interval; candidates are ranked by its lower end
  draws: 2000  # importance-sampling draws per posterior
  workers: 12

fitcheck:
  # P3.5: model-fit checks before exploiting (pre-registered; see phase3_fitcheck.py).
  # Standard and pairs-first bots and hands are P3.2's; connectors-first and gear-change bots
  # are new. The recommender settings are P3.4's.
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [10, 30, 100, 300, 1000, 3000]
  calibration_bots: 300  # per seed, drawn from the fitted prior (never test bots)
  fit_level: 0.05  # false-alarm level for a bot the model describes (half per check)
  check_draws: 400  # posterior predictive replicates per check
  ps: [0.1, 0.25, 0.5, 0.75, 0.9]
  level: 0.9
  draws: 2000
  workers: 12

confirm:
  # P3.5b: P3.5's post-hoc stability-only fallback, tested on fresh seeds (pre-registered; see
  # phase3_confirm.py). Identical to `fitcheck` except that the seeds are new.
  stack: 10
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [10, 30, 100, 300, 1000, 3000]
  calibration_bots: 300
  fit_level: 0.05
  check_draws: 400
  ps: [0.1, 0.25, 0.5, 0.75, 0.9]
  level: 0.9
  draws: 2000
  workers: 12

import:
  # P3.6: PHH import (pre-registered; see phase3_import.py). Dataset paths are relative to the
  # PHH dataset's data/ folder at dataset_commit (fetched by experiments/datasets.py).
  round_trip_tables: 400
  round_trip_hands: 25
  mutation_hands: 1000
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  dataset_paths:
    - pluribus
    - wsop
    - alice-carol-wikipedia.phh
    - antonius-blom-2009.phh
    - arieh-yockey-2019.phh
    - dwan-ivey-2009.phh
    - phua-xuan-2019.phh
  workers: 12

priors:
  # P3.7: population priors fit to real players, and checks that the synthetic-trained models
  # transfer to them (pre-registered; see phase3_priors.py).
  real_source: pluribus           # or "standin": a simulated stand-in (development, quick run)
  dataset_commit: e47fbd5816372360bade4de5d712346fe1bb70f6
  dataset_path: pluribus          # relative to the PHH dataset's data/ folder
  bot_player: Pluribus            # never fit or scored; reported as an extra row
  phase1_config: experiments/configs/phase1.yaml
  phase1_master_seed: 2026        # the five Phase 1 replicates (experiments/cache)
  estimate_sizes: [25, 50, 100, 200, 500, 1000]
  windows_max: 20                 # disjoint windows per player and sample size
  prior_bootstrap: 1000           # part A: refits per bootstrap over players
  bootstrap: 2000                 # every other bootstrap over players
  min_players_grid: [2, 3, 5, 8, 12, 30, 100, 300]
  subset_draws: 20
  support_alpha: 0.05
  consistency_reference: 1000
  action_checkpoints: [0, 25, 100, 500, 1500]   # Phase 1's
  action_window: 100
  action_train_rows: 150000
  workers: 12
