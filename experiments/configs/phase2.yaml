# Phase 2 experiments: python -m experiments.run_phase2 --seed 2026
name: phase2
cfr:
  variants: [cfr, cfr+, lcfr, dcfr]
  iterations: {kuhn: 10000, leduc: 10000}
  per_decade: 8
  mccfr_seeds: 5
  mccfr_iterations: {kuhn: 100000, leduc: 300000}
  mccfr_per_decade: 4
  ablation_iterations: 3000  # post hoc: discounted-CFR exponent grid on Leduc
deep_cfr:
  seeds: 5
  traversals: 1000          # per player per iteration
  checkpoints: [1, 2, 3, 5, 7, 10, 15, 20, 30, 50, 70, 100]
  policy_checkpoints: [10, 30, 100]
  hidden: [64, 64, 64]
  advantage_steps: 600      # chosen on development seed 99 (see poker_lab/solvers/deep_cfr.py)
  policy_steps: 2000
  workers: 8
exploit:
  seeds: 5
  train_per_archetype: 20   # used only to fit the parameter prior
  test_per_archetype: 6     # held-out bots evaluated per seed
  sizes: [10, 30, 100, 300, 1000, 3000]
  ps: [0.25, 0.5, 0.75, 0.9]
  dbr_pseudocount: 10       # data-biased confidence c_I = n_I / (n_I + 10)
  workers: 10
aivat:
  bots_per_archetype: 10    # Leduc bots: one population drawn from the seed
  rnr_p: 0.9                # the exploiting hero: restricted Nash response to the bot's true policy
  cfr_checkpoints: [1, 3, 10, 30, 100, 300, 1000]  # value functions from CFR+ average strategies
  half_width: 0.1           # chips/hand: hands needed for a 95% interval this wide
  sampled_bots: 2           # per archetype: matchups also played out hand by hand
  sampled_pairs: 20000      # duplicate deals per sampled matchup
  pushfold:
    stacks: [5, 10, 20]     # P3.3's matchups, computed exactly
    half_width: 0.05        # bb/hand, as in P3.3
  workers: 10
duplicate:
  replicates: 10              # bot populations, each from its own seed (derive_seeds)
  population_per_archetype: 12
  lineups: {clones_6: 5, mirror_6: 5, mixed_6: 10, mixed_3: 10, mixed_2: 20}  # per replicate
  deals: 2000                 # per lineup; a deal is played at n tables (n hands)
  chunk_deals: 250            # deals per worker task (one duplicate match)
  calling_deals: 200          # the always-call check
  equity_samples: 150         # the bots' Monte Carlo equity samples, as in Phase 1
  half_width: 5               # bb/100: hands needed for a 95% interval this wide
  bootstrap: 2000             # resamples of lineups for the CI of a median ratio
  workers: 12

randomness:         # P2.11c: clones_6 of ``duplicate``, the same seeds and sizes
  replicates: 10
  population_per_archetype: 12
  lineups_per_replicate: 5    # one per archetype
  deals: 2000
  chunk_deals: 250
  equity_samples: 150
  half_width: 5
  bootstrap: 2000
  workers: 12
misspec:            # P2.12: the same bots as ``exploit``, then opponents outside the model
  seeds: 5
  train_per_archetype: 20
  test_per_archetype: 6
  sizes: [10, 30, 100, 300, 1000, 3000]
  ps: [0.5, 0.9]
  dbr_pseudocount: 10
  session:
    hands: 2000
    period: 50          # hands between an adaptive bot's updates
    pseudo: 10          # its prior on the hero, in hands
    refit_every: 100    # a refitting hero
    fit_once_at: 300    # a hero that fits once
    recent_window: 300
    rnr_p: 0.9
    rnr_p_low: 0.5
  adaptive:
    family_slow: {speed: 0.1, window: 400, mode: family}
    family_fast: {speed: 0.5, window: 100, mode: family}
    tabular_slow: {speed: 0.1, window: 400, mode: tabular}
    tabular_fast: {speed: 0.5, window: 100, mode: tabular}
  workers: 12
lbr:                # P2.8b: local best response (lower bounds on exploitability), heads-up NLHE
  deep_stack: 100     # bb
  shallow_stack: 10   # bb: the push/fold game of P3.1, where exact values are known
  deep_deals: 2000    # duplicate deals (two hands each) per opponent at 100 bb
  shallow_deals: 4000
  chunk_deals: 250    # deals per worker job
  flop_sample: 300    # of the flop's 1,176 runouts, for LBR's and the models' equities
  ablation_opponents: [pot_odds, bot_tag]
  ablation_deals: 500 # no range tracking / all flop runouts, on the main rows' first deals
  workers: 4
